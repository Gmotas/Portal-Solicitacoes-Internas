name: Verificação do projeto
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Verificar sintaxe
        run: npm run check
      - name: Testar fluxos e persistência
        run: npm test
      - name: Validar configuração Docker Compose
        run: docker compose config
